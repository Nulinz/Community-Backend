# azure-pipelines.yml
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
      - checkout: self

      - task: NodeTool@0
        inputs:
          versionSpec: '22.x'
        displayName: 'Set up Node.js'

      - script: |
          npm install
          npm run build --if-present
          npm run test --if-present
        displayName: 'npm install, build, and test'

      - task: PublishBuildArtifacts@1
        inputs:
          pathToPublish: '$(System.DefaultWorkingDirectory)'
          artifactName: 'node-app'

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployJob
    steps:
      - download: current
        artifact: node-app

      - task: AzureWebApp@1
        inputs:
          azureSubscription: 'AzureWebApp-Gradenvy'   # set up in Project Settings > Service connections
          appName: 'gradenvy-backend'
          package: '$(Pipeline.Workspace)/node-app'
