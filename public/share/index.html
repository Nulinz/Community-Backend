<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grad Envy - Explore & Join</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="Grad Envy - Take Action. Earn Rewards.">
  <meta name="description" content="View shared opportunities, events, and career tools on Grad Envy. Download the app on Google Play.">
  <meta name="theme-color" content="#EA580C">

  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gradenvy.com/share">
  <meta property="og:title" content="Grad Envy - Career Opportunities & Events">
  <meta property="og:description" content="Join the Grad Envy community. Discover jobs, internships, and live events!">
  <meta property="og:image" content="https://gradenvy.com/assets/Images/App_Logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #EA580C;
      --primary-dark: #C2410C;
      --bg: #FAFBFD;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #F1F5F9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.08);
      padding: 36px 24px;
      text-align: center;
      max-width: 440px;
      width: 100%;
    }

    .logo-container {
      width: 64px;
      height: 64px;
      background: #0F172A;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px -4px rgba(15, 23, 42, 0.15);
    }

    .logo-container img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    h1 span {
      color: var(--primary);
    }

    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-playstore {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0F172A;
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 10px 20px -4px rgba(15, 23, 42, 0.2);
      transition: transform 0.2s, background 0.2s;
    }

    .btn-playstore:active {
      transform: scale(0.98);
      background: #1E293B;
    }

    .redirect-status {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #E2E8F0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <img src="https://gradenvy.com/assets/Images/App_Logo.png" alt="Grad Envy" onerror="this.style.display='none'">
    </div>

    <h1>Grad<span>Envy</span></h1>
    <p class="subtitle" id="content-desc">
      Opening in the Grad Envy app... If the app is not installed, you will be redirected to the Google Play Store.
    </p>

    <a id="store-btn" class="btn-playstore" href="https://play.google.com/store/apps/details?id=com.grad.envy">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.609 1.814L13.793 12 3.61 22.186c-.37-.417-.61-.986-.61-1.63V3.444c0-.644.24-1.213.61-1.63zM15.207 13.414l2.42 2.42-12.78 7.378 10.36-9.798zm0-2.828L4.847.788 17.627 8.166l-2.42 2.42zm1.414 1.414l3.155-1.821c.883-.51.883-1.341 0-1.851L16.621 8.33l-2.121 2.121 2.121 2.549z"/>
      </svg>
      <span>Download on Google Play</span>
    </a>

    <div class="redirect-status" id="redirect-status">
      <div class="spinner"></div>
      <span>Redirecting you to Google Play...</span>
    </div>
  </div>

  <script>
    // 1. Parse query and path parameters
    const url = new URL(window.location.href);
    let targetParam = '';

    // Handle format: https://gradenvy.com/share/event_Id=...
    const pathParts = window.location.pathname.split('/');
    const lastPart = pathParts[pathParts.length - 1] || pathParts[pathParts.length - 2] || '';
    if (lastPart.includes('=')) {
      targetParam = lastPart;
    } else {
      // Handle query parameters like ?event_Id=... or ?event_id=...
      targetParam = url.search ? url.search.substring(1) : '';
    }

    const packageName = 'com.grad.envy';
    const playStoreUrl = `https://play.google.com/store/apps/details?id=${packageName}`;
    const customSchemeUrl = `gradenvy://share/${targetParam}`;

    // 2. Set button URL
    const storeBtn = document.getElementById('store-btn');
    storeBtn.href = playStoreUrl;

    // 3. Detect Platform
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(userAgent);
    const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

    let appOpened = false;
    window.addEventListener('blur', () => { appOpened = true; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) appOpened = true;
    });

    if (isAndroid) {
      // Android Intent: tries to open the app; if not installed, Chrome falls back to Play Store automatically!
      const intentUrl = `intent://share/${targetParam}#Intent;scheme=gradenvy;package=${packageName};S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end;`;
      
      // Attempt opening intent immediately
      window.location.href = intentUrl;

      // Fallback timer in case the browser blocked intent redirection
      setTimeout(() => {
        if (!appOpened) {
          window.location.href = playStoreUrl;
        }
      }, 1500);
    } else if (isIOS) {
      // iOS: Try custom scheme, fallback to Store
      window.location.href = customSchemeUrl;
      setTimeout(() => {
        if (!appOpened) {
          window.location.href = playStoreUrl; // or App Store link when published
        }
      }, 1500);
    } else {
      // Desktop: User can click the Google Play button
      document.getElementById('redirect-status').style.display = 'none';
    }
  </script>
</body>
</html>
